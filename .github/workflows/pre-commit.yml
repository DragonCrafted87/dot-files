name: pre-commit

on:
  pull_request:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      # Mode hooks fail because Contents API writes 100644.
      # cspell/markdownlint need local dict/rule tuning; run them locally.
      SKIP: check-executables-have-shebangs,check-shebang-scripts-are-executable,cspell,markdownlint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: pre-commit/action@v3.0.1
