name: pre-commit

on:
  pull_request:
  push:
    branches:
    - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      # Local `pre-commit run` still runs the full set.
      # CI skips hooks that need +x bits, a pylint 4 rc upgrade, or
      # dictionary/markdown churn on existing docs.
      SKIP: check-executables-have-shebangs,check-shebang-scripts-are-executable,cspell,markdownlint,mdformat,pylint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: pre-commit/action@v3.0.1
