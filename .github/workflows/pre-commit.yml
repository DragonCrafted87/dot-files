name: pre-commit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      # GitHub Contents writes 100644, so mode hooks fail in CI.
      # Keep them on for local `pre-commit run`.
      SKIP: check-executables-have-shebangs,check-shebang-scripts-are-executable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
