monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Insta360.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { device.name = "~alsa_card.usb-0b0e_Jabra_Speak_710.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = false
        api.alsa.ignore-dB = false
        device.profile = "output:analog-stereo+input:mono-fallback"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-0b0e_Jabra_Speak_710.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
