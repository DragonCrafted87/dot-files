# Keep this aligned with windows/terminal-settings.json (Windows Terminal is
# the source of truth for look and feel).

# Font: WT defaults.face = Lucida Sans Typewriter
# Kitty falls back to monospace if this face is missing on Linux.
font_family Lucida Sans Typewriter
bold_font auto
italic_font auto
bold_italic_font auto

# WT profiles.defaults.colorScheme = Tango Dark
foreground #D3D7CF
background #000000
cursor #FFFFFF
cursor_text_color #000000
selection_foreground #000000
selection_background #FFFFFF
color0  #000000
color1  #CC0000
color2  #4E9A06
color3  #C4A000
color4  #3465A4
color5  #75507B
color6  #06989A
color7  #D3D7CF
color8  #555753
color9  #EF2929
color10 #8AE234
color11 #FCE94F
color12 #729FCF
color13 #AD7FA8
color14 #34E2E2
color15 #EEEEEC

# WT copyOnSelect / copyFormatting
copy_on_select clipboard
strip_trailing_spaces smart

# WT: right-click paste is implicit in many Windows terminals
mouse_map right press ungrabbed paste_from_clipboard

# WT multiLinePasteWarning = false
paste_actions replace-dangerous-control-codes

# WT Git Bash padding = 0
window_padding_width 0

# WT launchMode = maximized (best kitty equivalent)
remember_window_size yes

# WT bellStyle = window
enable_audio_bell no
window_alert_on_bell yes
visual_bell_duration 0.08

# WT actions
map ctrl+shift+f show_scrollback
map alt+shift+d launch --location=split --cwd=current
