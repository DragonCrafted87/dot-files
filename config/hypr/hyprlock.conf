general {
    disable_loading_bar = false
    grace = 2
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    # Palette from config/kitty/kitty.conf (Tango Dark).
    outer_color = rgb(3465A4)
    inner_color = rgb(EEEEEC)
    font_color = rgb(000000)
    check_color = rgb(4E9A06)
    fail_color = rgb(CC0000)
    fade_on_empty = false
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
