# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/
# https://wiki.hypr.land/0.48.0/Configuring/
#
# Split layout for Hyprland 0.48 (hyprlang). Lua is not required.
# Parsing is linear: each source= is read in full before the next line.
#
# Drop this tree into ~/.config/hypr/ :
#   hyprland.conf
#   conf.d/*.conf

source = ~/.config/hypr/conf.d/env.conf
source = ~/.config/hypr/conf.d/monitors.conf
source = ~/.config/hypr/conf.d/programs-autostart.conf
source = ~/.config/hypr/conf.d/look-and-feel.conf
source = ~/.config/hypr/conf.d/input.conf
source = ~/.config/hypr/conf.d/keybinds.conf
source = ~/.config/hypr/conf.d/window-rules.conf
