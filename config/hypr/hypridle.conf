general {
    lock_cmd = pidof hyprlock || hyprlock
    # Do not hook idle-display-off here. SUPER+L / loginctl lock-session
    # fires on_lock_cmd, and blanking + HDMI disable hid the lock screen
    # and skipped workspace restore until unlock.
    on_unlock_cmd = ~/.config/hypr/scripts/idle-display-on.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/idle-display-on.sh
    ignore_dbus_inhibit = false
}

# Blank after idle. This is the only path that should disable HDMI.
listener {
    timeout = 420
    on-timeout = ~/.config/hypr/scripts/idle-display-off.sh
    on-resume = ~/.config/hypr/scripts/idle-display-on.sh
}

# Lock
listener {
    timeout = 900
    on-timeout = pidof hyprlock || hyprlock
}
