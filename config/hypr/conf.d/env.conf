#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/0.48.0/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,breeze_cursors
env = HYPRCURSOR_THEME,breeze_cursors

# XDG user dirs — Ly does not set these
env = XDG_DATA_HOME,/home/dragon/.local/share
env = XDG_CONFIG_HOME,/home/dragon/.config
env = XDG_STATE_HOME,/home/dragon/.local/state
env = XDG_CACHE_HOME,/home/dragon/.cache

# keep your existing session tags if you have them
# KDE is listed so Dolphin / KIO honor KService + OnlyShowIn=KDE apps
# (LibreOffice, Okular) when picking "Open with".
env = XDG_CURRENT_DESKTOP,Hyprland:KDE
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,kde
env = QT_QUICK_CONTROLS_STYLE,org.kde.desktop
env = GDK_BACKEND,wayland,x11
env = GTK_THEME,Adwaita:dark
env = TERMINAL,kitty

# LibreOffice toolbars follow VCL, not just the document ColorScheme.
# kf6/qt6 reads kdeglobals Tango Dark; gtk3 stays on Adwaita chrome.
env = SAL_USE_VCLPLUGIN,kf6

# Stop ssh/git GUI askpass from trying X11 forwarding in VS Code.
env = SSH_ASKPASS_REQUIRE,never
