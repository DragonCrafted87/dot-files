########################################
### runewyrm / workshare — release DP
########################################

# Disable both DisplayPort outputs so the work machine can drive them
# (KVM / cable swap / dock). runewyrm keeps the HDMI panel as its screen.

monitor=DP-2,disable
monitor=DP-3,disable
monitor=HDMI-A-1,2560x1440@143.91Hz,0x0,1
