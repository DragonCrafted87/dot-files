###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/0.48.0/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

#bind = $mainMod, Space, exec, ~/.config/hypr/menu.sh
bind = $mainMod, Space, exec, qs -c startmenu ipc call startmenu toggle

# Example binds, see https://wiki.hypr.land/0.48.0/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, F4, exec, ~/.config/hypr/scripts/session-control.sh logout
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, L, exec, loginctl lock-session

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
# Visible workspace: focus that monitor. Hidden: move it under the cursor.
bind = $mainMod, 1, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 1
bind = $mainMod, 2, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 2
bind = $mainMod, 3, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 3
bind = $mainMod, 4, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 4
bind = $mainMod, 5, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 5
bind = $mainMod, 6, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 6
bind = $mainMod, 7, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 7
bind = $mainMod, 8, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 8
bind = $mainMod, 9, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 9
bind = $mainMod, 0, exec, python3 ~/.config/hypr/scripts/switch-workspace.py 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, movetoworkspacesilent, special:minimized

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Keyboard volume keys stay on the desk soundbar.
# Cap at 150% so the OSD can show red past 100%.
# Jabra Speak 710 buttons are handled by jabra_volume.py.
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 2.5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2.5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod SHIFT, D, exec, ~/.config/hypr/scripts/display-switch.sh desk
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/display-switch.sh single
