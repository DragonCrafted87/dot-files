################
### MONITORS ###
################

# See https://wiki.hypr.land/0.48.0/Configuring/Monitors/
#
# This file stays identical on every machine. Hyprland parses it on every
# reload, so it MUST NOT contain a `monitor =` rule. A wildcard
# `monitor = , highrr, auto, 1` re-autoplaces outputs and shuffles
# order/positions relative to the live profile.
#
# Host-specific layouts live in monitors.d/ and are applied by
# scripts/display-profile.sh (via display-switch.sh restore on startup).
# Unknown connector names are ignored by Hyprland, but an explicit mode
# for DP-2/DP-3/HDMI-A-1 will still clobber a docked laptop that happens
# to use those same names. Keep those rules out of this file.

# Startup only. Reloads must not re-run this: keyword monitor from a
# profile apply can retrigger a reload and spin the compositor.
# display-switch restores saved monitors + audio and starts the HDMI
# watcher only for theater/workshare.
exec-once = ~/.config/hypr/scripts/display-switch.sh restore
