################
### MONITORS ###
################

# See https://wiki.hypr.land/0.48.0/Configuring/Monitors/
#
# This file stays identical on every machine. The fallback rule is the only
# thing parsed from disk. Host-specific layouts live in monitors.d/ and are
# applied by scripts/display-profile.sh so a laptop never inherits runewyrm's
# triple-head layout, and so desk/theater/workshare can be swapped live.
#
# Unknown connector names are ignored by Hyprland, but an explicit mode for
# DP-2/DP-3/HDMI-A-1 will still clobber a docked laptop that happens to use
# those same names. Keep those rules out of this file.

# Fallback if a display is not listed by the active profile
monitor = , highrr, auto, 1

# Startup only. Do not `exec = apply` on reload: keyword monitor from apply
# can retrigger a reload and spin the compositor with DP outputs disabled.
exec-once = ~/.config/hypr/scripts/display-profile.sh apply
