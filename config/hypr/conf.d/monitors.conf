################
### MONITORS ###
################

# See https://wiki.hypr.land/0.48.0/Configuring/Monitors/
#
# This file is parsed on every hyprctl reload. Hyprland clears monitor
# rules first, then re-reads sourced files. With no monitor= lines it
# autoplaces every output and shuffles the desk.
#
# Seed file is committed so the first parse never fails if state/ is empty.
# display-switch.sh / display-profile.sh copy the last layout to the
# runtime file and reload once when they have to create it.

source = ~/.config/hypr/conf.d/monitors.d/default.conf
source = ~/.local/state/hypr/monitors.runtime.conf

# Startup only. Reloads must not re-run this: keyword monitor from a
# profile apply can retrigger a reload and spin the compositor.
# display-switch restores saved monitors + audio, writes the runtime
# layout, and starts the HDMI watcher only for theater/workshare.
exec-once = ~/.config/hypr/scripts/display-switch.sh restore
