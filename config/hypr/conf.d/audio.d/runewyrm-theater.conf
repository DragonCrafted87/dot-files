# Navi 31 native HDMI is HDMI 4 / extra3 (AVR / ELMO MC1).
# After a cold plug + reboot ACP exposes 7.1; hotplug often only stereo.
CARD=alsa_card.pci-0000_03_00.1
CARD_PROFILE=hdmi-surround71-extra3
CARD_PROFILE_FALLBACK=hdmi-stereo-extra3
SINK_MATCH=hdmi-surround71-extra3
SINK_FALLBACK=hdmi-stereo-extra3
