###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/0.48.0/Configuring/Keywords/

$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

# Import compositor env into the user systemd, then bind graphical-session.target
# (RefuseManualStart). That starts hypridle, hyprpolkitagent, mako, and
# network-mounts. exec-once lines run in parallel; this script sequences import
# then the bind unit.
exec-once = ~/.config/hypr/scripts/graphical-session.sh start
exec-shutdown = ~/.config/hypr/scripts/graphical-session.sh stop

# plasma-workspace used to own this cache. Rebuild so Dolphin can resolve .desktop files.
exec-once = kbuildsycoca6 --noincremental

exec-once = $terminal
# ~/.local/bin/brave-browser wrapper applies brave-flags.conf. OM wrapper ignores it.
exec-once = brave-browser
exec-once = steam
exec-once = /var/lib/flatpak/app/com.discordapp.Discord/current/active/export/bin/com.discordapp.Discord

# Phone SMS / clipboard / notifications (GrapheneOS pairing notes in setup/files/kdeconnect).
exec-once = bash ~/.config/hypr/scripts/start-kdeconnect.sh

#launcher
exec-once = /home/dragon/.config/hypr/scripts/startmenu.sh
exec-once = qs -c volume-osd -d -n

# Keep the active border gradient spinning (0.48 loop workaround)
exec-once = ~/.config/hypr/scripts/spin-border.sh

# Litra Glow pair follows the Insta360 Link camera stream.
exec-once = python3 ~/.config/hypr/scripts/litra-camera-lights.py watch

# Per-monitor astronomy stills. Daily timer also refreshes them.
exec-once = ~/.config/hypr/scripts/astro-wallpaper.sh apply
