###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/0.48.0/Configuring/Keywords/

$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

# Import compositor env into the user systemd, then bind graphical-session.target
# (RefuseManualStart). That starts hypridle, hyprpolkitagent, mako,
# network-mounts, and the role session target (workstation-session or
# htpc-session). exec-once lines run in parallel; this script sequences import
# then the bind unit.
exec-once = ~/.config/hypr/scripts/graphical-session.sh start
exec-shutdown = ~/.config/hypr/scripts/graphical-session.sh stop

# plasma-workspace used to own this cache. Rebuild so Dolphin can resolve .desktop files.
exec-once = kbuildsycoca6 --noincremental

# Desk GUI apps are child units of workstation-session.target. HTPC extras
# are htpc-session.target. enable-session-units picks one.

# Shared chrome (not a desk app).
exec-once = qs -c volume-osd -d -n

# Per-monitor astronomy stills. Daily timer also refreshes them.
exec-once = ~/.config/hypr/scripts/astro-wallpaper.sh apply
