###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/0.48.0/Configuring/Keywords/

$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)

exec-once = hypridle

# Attach to the PAM-started daemon when present; otherwise start one.
# Brave needs secrets unlocked before it writes session/cookies.
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = $terminal
exec-once = brave-browser --ozone-platform=wayland --disable-features=WaylandWpColorManagerV1 --password-store=gnome-libsecret --restore-last-session
exec-once = steam
exec-once = /var/lib/flatpak/app/com.discordapp.Discord/current/active/export/bin/com.discordapp.Discord

exec-once = systemctl --user start hyprpolkitagent

#launcher
exec-once = /home/dragon/.config/hypr/scripts/startmenu.sh

# Keep the active border gradient spinning (0.48 loop workaround)
exec-once = ~/.config/hypr/scripts/spin-border.sh
