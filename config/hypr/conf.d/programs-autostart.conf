#################
### AUTOSTART ###
#################

# See https://wiki.hypr.land/0.48.0/Configuring/Keywords/

$terminal = kitty

exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once = kbuildsycoca6 --noincremental

exec-once = $terminal
# Wrapper in ~/.local/bin/brave-browser applies brave-flags.conf.
exec-once = brave-browser
exec-once = steam
exec-once = /var/lib/flatpak/app/com.discordapp.Discord/current/active/export/bin/com.discordapp.Discord
