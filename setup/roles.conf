# What each machine role runs.
# role.sh reads [common] first, then the named role section, then each
# enabled [subrole.*] section saved in ~/.config/dot-files/subroles.
# A line starting with @ includes another section.
# Subroles are applied by --enable-subrole; they are not derived from
# the hostname.

[common]
bootstrap-tools
configure-ssh-key
configure-authorized-keys
register-github-ssh-key
link-dotfiles
link-home-files
harden-secrets
configure-sudoers
link-root-shell
install-oh-my-posh
set-timezone
enable-rock-repos
install-base-packages
configure-xdg-user-dirs
configure-boot-display
remove-plasma-sddm
configure-console-blank
enable-user-linger

[workstation]
install-hyprland-session
install-hyprshutdown
configure-bluetooth-login
install-desktop-packages
install-ffmpeg-tools
install-brave
configure-brave-keyring
install-workstation-packages
configure-vscode
install-python-dev
install-makemkv
install-office-printing
configure-mime-defaults
configure-tango-icons
install-flatpak-apps
configure-obs
configure-litra-glow
configure-ratbag
configure-astro-wallpaper
install-kdeconnect
enable-session-units
install-network-mounts
install-boinc
harden-secrets
link-user-config
configure-app-colors

[htpc]
install-hyprland-session
install-hyprshutdown
configure-bluetooth-login
install-desktop-packages
configure-mime-defaults
configure-tango-icons
install-brave
configure-brave-keyring
configure-astro-wallpaper
enable-session-units
install-k3s
install-boinc
link-user-config
configure-app-colors
configure-htpc

[server]
install-k3s
install-boinc
link-user-config
configure-server

[subrole.laptop]
configure-laptop

[subrole.gaming]
install-gaming-packages
configure-xbox-controller

[subrole.artifact-repo]
install-artifact-repo-manager

[subrole.nfs-server]
install-nfs-server
