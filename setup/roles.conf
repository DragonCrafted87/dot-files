# What each machine role runs.
# role.sh reads [common] first, then the named role section.
# A line starting with @ includes another section (laptop is workstation
# plus laptop-only modules).

[common]
configure-ssh-key
configure-authorized-keys
register-github-ssh-key
link-dotfiles
link-home-files
harden-secrets
configure-sudoers
link-root-shell
install-oh-my-posh
set-timezone
enable-rock-repos
install-base-packages
configure-boot-display
remove-plasma-sddm
configure-console-blank
enable-user-linger

[workstation]
install-hyprland-session
configure-bluetooth-login
install-desktop-packages
install-ffmpeg-tools
install-brave
configure-brave-keyring
install-workstation-packages
configure-vscode
install-python-dev
install-makemkv
install-office-printing
configure-mime-defaults
install-gaming-packages
install-flatpak-apps
configure-obs
install-kdeconnect
enable-session-units
install-network-mounts
install-boinc
harden-secrets
link-user-config

[laptop]
@workstation
configure-laptop

[htpc]
install-hyprland-session
configure-bluetooth-login
install-desktop-packages
configure-mime-defaults
install-brave
configure-brave-keyring
enable-session-units
install-k3s
install-boinc
link-user-config
configure-htpc

[server]
install-k3s
install-boinc
link-user-config
configure-server
