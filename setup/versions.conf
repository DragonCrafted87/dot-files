# Pinned versions for source builds. Next to role.sh so one file is the
# bump point. Modules load this from lib.sh. An already-exported env var
# wins, so BOINC_VERSION=... role.sh still works for a one-off.
#
# Add a line when a new manual build lands. Do not put secrets here.

BOINC_VERSION=8.2.13
BOINC_TAG=client_release/8.2/8.2.13
MAKEMKV_VERSION=1.18.4

# Hyprland source prefix. Tags match the Debian-Hyprland / Fedora COPR
# 0.56.2 set. Prefix default is /opt/hyprland-${HYPRLAND_SOURCE_VERSION}.
