# Hyper-V synthetic devices. force_drivers keeps these modules in every
# initramfs so a kernel update can still mount the root SCSI disk.
# Names confirmed in the OpenMandriva Rock znver1 kernel-server package:
# hv_vmbus.ko, hv_storvsc.ko, hv_netvsc.ko, hv_utils.ko.
force_drivers+=" hv_vmbus hv_storvsc hv_netvsc hv_utils "
