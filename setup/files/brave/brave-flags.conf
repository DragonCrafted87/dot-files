# Single source for /usr/bin/brave-browser.
# Linked to ~/.config/brave-flags.conf. Do not append from modules.
#
# Hyprland + Chromium still abort on wp_image_description ("Custom
# primaries aren't supported"). Stay on XWayland until that is fixed.
# WaylandWpColorManagerV1 is also disabled in case something flips ozone.
--password-store=gnome-libsecret
--restore-last-session
--force-dark-mode
--ozone-platform=x11
--ozone-platform-hint=x11
--disable-features=WaylandWpColorManagerV1
