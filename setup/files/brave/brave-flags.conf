# Canonical flags. ~/.local/bin/brave-browser reads this file.
# OpenMandriva's /usr/bin/brave-browser does NOT source
# ~/.config/brave-flags.conf (that path is an Arch/Debian convention).
#
# Working combo on Hyprland: native Wayland + kill color-manager.
# Bare Wayland without that feature flag aborts:
#   Custom primaries aren't supported
--password-store=gnome-libsecret
--restore-last-session
--force-dark-mode
--ozone-platform=wayland
--ozone-platform-hint=wayland
--disable-features=WaylandWpColorManagerV1
